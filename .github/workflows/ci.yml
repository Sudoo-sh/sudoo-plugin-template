name: CI

# Validate, test and pack every plugin in this repository on each push and pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path: [plugin, examples/notification-channel]
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version-file: .python-version

      # The SDK comes from PyPI. Until its first release is there, this run (and only this run: nothing is
      # committed) takes it from its Git repository instead; once it is published this step does nothing.
      - name: The SDK from Git while it is not on PyPI
        run: |
          if curl -fsS --retry 3 -o /dev/null https://pypi.org/simple/sudoo-plugin-sdk/; then
            echo "sudoo-plugin-sdk is on PyPI."
          else
            printf '\n[tool.uv.sources]\nsudoo-plugin-sdk = { git = "https://github.com/Sudoo-sh/sudoo-plugin-sdk" }\n' >> pyproject.toml
            echo "::notice::sudoo-plugin-sdk is not on PyPI yet; this run installs it from GitHub."
          fi

      - name: Install the SDK and tools
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (black)
        run: uv run black --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Validate (the hub's automated checks)
        run: uv run sudoo-plugin validate

      - name: Test (against the SDK's fake panel)
        run: uv run sudoo-plugin test

      - name: Pack
        run: uv run sudoo-plugin pack

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ strategy.job-index }}
          path: ${{ matrix.path }}/dist/*.sudoo
          if-no-files-found: error
          retention-days: 14
